<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엄뚝이 프롬프트 자료</title>
<meta name="description" content="AI를 처음 써보는 분들이 바로 따라 할 수 있게 만든 프롬프트 자료 모음입니다.">
<meta property="og:title" content="엄뚝이 프롬프트 자료">
<meta property="og:description" content="복사해서 바로 쓰는 AI 프롬프트 자료 모음">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE7; --card:#fff; --ink:#2A241F; --soft:#6E6358;
  --line:#E3DACD; --point:#C4452A; --point-soft:#E4705A;
  color-scheme: light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:660px; margin:0 auto; padding:40px 20px 72px}
.badge{
  display:inline-block; background:var(--point); color:#fff;
  font-size:13px; font-weight:700; padding:6px 14px; border-radius:999px;
  letter-spacing:.02em;
}
h1{
  font-family:"Gowun Batang",serif; font-weight:700;
  font-size:30px; line-height:1.4; margin:18px 0 10px; letter-spacing:-.01em;
}
.lead{margin:0 0 6px; color:var(--soft); font-size:16px}
.rule{height:1px; background:var(--line); margin:30px 0 26px; border:0}
h2{font-size:15px; color:var(--soft); font-weight:700; margin:0 0 14px; letter-spacing:.02em}
a.card{
  display:block; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:20px 20px 18px; margin-bottom:14px;
  text-decoration:none; color:inherit; transition:transform .15s, box-shadow .15s;
}
a.card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(42,36,31,.09)}
.card .no{
  display:inline-block; background:var(--bg); color:var(--point);
  font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; margin-bottom:10px;
}
.card h3{margin:0 0 6px; font-size:19px; font-weight:700; line-height:1.45}
.card p{margin:0; font-size:15px; color:var(--soft)}
.card .go{margin-top:12px; font-size:14px; color:var(--point); font-weight:700}
.note{
  background:#FBF8F3; border:1px dashed var(--line); border-radius:14px;
  padding:18px 20px; margin-top:28px; font-size:15px; color:var(--soft);
}
.note b{color:var(--ink)}
footer{margin-top:34px; text-align:center; font-size:14px; color:var(--soft); line-height:1.9}
footer .sig{font-family:"Gowun Batang",serif; color:var(--ink); font-size:16px}
@media (max-width:420px){
  .wrap{padding:30px 16px 56px}
  h1{font-size:25px}
}
</style>
</head>
<body>
<div class="wrap">

  <span class="badge">엄뚝이 프롬프트 자료</span>
  <h1>복사해서 바로 쓰는<br>AI 프롬프트 모음</h1>
  <p class="lead">처음 해보는 분도 따라만 하면 돼요.<br>복사 버튼 누르고, 붙여넣으면 끝이에요.</p>

  <hr class="rule">

  <h2>자료 목록</h2>

  <a class="card" href="danggeun/">
    <span class="no">01</span>
    <h3>당근마켓 상품사진 만들기</h3>
    <p>집에서 찍은 사진 한 장으로 중고거래용 상품사진 5장을 만들어요.</p>
    <div class="go">열어보기 →</div>
  </a>

  <a class="card" href="magnet/">
    <span class="no">02</span>
    <h3>여행 마그넷 만들기</h3>
    <p>다녀온 여행지를 작은 마그넷 그림으로 남겨요.</p>
    <div class="go">열어보기 →</div>
  </a>

  <div class="note">
    <b>휴대폰에서 보셔도 돼요.</b><br>
    자료 안의 <b>복사</b> 버튼을 누르면 프롬프트가 그대로 복사돼요.
    챗GPT 앱에 붙여넣기만 하시면 됩니다.
  </div>

  <footer>
    <div class="sig">엄뚝이</div>
    AI를 먼저 해보고 돌아와 알려드려요
  </footer>

</div>
</body>
</html>
